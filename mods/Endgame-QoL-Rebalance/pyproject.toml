[project]
name = "EndgameQoLRebalance"
version = "1.0.9"
authors = [{ name = "Kgx37b9" }]
description = """\
EndgameQoLRebalance 1.0.9<br>\
Author: Kgx37b9<br><br>\
Configure enemy and loot levels, UVHM balance, raid-boss health, game and money growth, \
loot markers and the Grog Nozzle mission reward.<br><br>\
Level Difference Corrections has independent switches for higher-level enemy resistance, \
enemy damage and elemental status chance. Resources and Storage contains separate \
backpack, personal-bank, ammo-capacity and Eridium-capacity switches, plus a UVHM ammo-drop slider (1x-5x, default 2x). Eridium 1000 requires a \
compatible Windows BL2 executable; an unsupported build is left unchanged.<br><br>\
Changes to options apply after a complete game restart. Co-op has not been validated. \
Personal gameplay use is permitted; prior written permission is required to reuse any original code. See LICENSE.md and README.md for features, compatibility, credits and installation.
"""

[tool.sdkmod]
name = "EndgameQoLRebalance"
version = "1.0.9"
supported_games = ["BL2"]
coop_support = "Unknown"
auto_enable = true
